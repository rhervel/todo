<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RHV - Tareas Pendientes (Vista Compacta)</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='square' stroke-linejoin='miter'><path d='M2 12h20M12 2v20M7 7l10 10M17 7L7 17'/></svg>">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Fondo Modo Oscuro */
    .dark .bg-grid-blueprint {
      background-color: #0b1329;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Fondo Modo Claro */
    .bg-grid-blueprint {
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.22) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Estilo Ficha CAD Estrecha */
    .blueprint-card {
      transition: all 0.15s ease;
    }
    .dark .blueprint-card { background: #1e293b; border: 1px solid #334155; }
    .blueprint-card { background: #ffffff; border: 1px solid #cbd5e1; }
  </style>
</head>
<body class="bg-grid-blueprint font-sans text-slate-800 dark:text-slate-200 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white pb-3">

  <!-- Contenedor Principal -->
  <div class="relative z-10 flex-grow">

    <!-- Encabezado Mínimo -->
    <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-300 dark:border-slate-800 sticky top-0 z-40 shadow-sm">
      <div class="max-w-7xl mx-auto px-2.5 py-1.5 flex items-center justify-between">
        
        <div class="flex items-center space-x-2">
          <div class="bg-sky-500/10 border border-sky-500/30 p-1 rounded-md text-sky-600 dark:text-sky-400">
            <i data-lucide="check-square" class="w-4 h-4"></i>
          </div>
          <div>
            <h1 class="font-bold text-xs text-slate-900 dark:text-slate-100 tracking-tight font-mono uppercase">TAREAS PENDIENTES</h1>
            <div class="flex items-center space-x-1">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span id="taskCount" class="text-[9px] font-mono text-slate-500 dark:text-slate-400">Cargando...</span>
            </div>
          </div>
        </div>

        <div class="flex items-center space-x-1">
          <button onclick="toggleTheme()" title="Cambiar tema" class="p-1.5 text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-md border border-slate-300 dark:border-slate-700">
            <i data-lucide="moon" class="w-3.5 h-3.5 hidden dark:block"></i>
            <i data-lucide="sun" class="w-3.5 h-3.5 block dark:hidden text-amber-600"></i>
          </button>
          <button onclick="fetchTasks()" title="Sincronizar Datos" class="p-1.5 text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-md border border-slate-300 dark:border-slate-700">
            <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i>
          </button>
        </div>

      </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 py-2 space-y-1.5">

      <!-- Estado de Carga -->
      <div id="loading" class="text-center py-8 text-slate-500 space-y-2 font-mono">
        <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto text-sky-500"></i>
        <p class="text-[10px] uppercase tracking-wider">Cargando registros...</p>
      </div>

      <!-- Lista de Tareas Ultra-Estrechas -->
      <div id="taskList" class="flex flex-col space-y-1.5"></div>

    </main>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbuFnsJl63dcRAWZqO1vGLszyNES4lZSkkd8vPo078-wRvnavbw_UUy5OZZUmdUXWY/exec";

    let tasks = [];

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      lucide.createIcons();
    }

    async function fetchTasks() {
      const syncIcon = document.getElementById('syncIcon');
      const loading = document.getElementById('loading');
      if (syncIcon) syncIcon.classList.add('animate-spin');
      if (tasks.length === 0 && loading) loading.classList.remove('hidden');

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        tasks = await response.json();
        renderTasks();
      } catch (err) {
        console.error("Error al sincronizar datos:", err);
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        if (loading) loading.classList.add('hidden');
      }
    }

    async function completeTask(id) {
      try {
        // UI optimista: eliminación instantánea de la vista
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();

        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "complete", taskId: id })
        });
      } catch (err) {
        console.error("Error al ticar tarea:", err);
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const countLabel = document.getElementById('taskCount');
      list.innerHTML = '';

      const today = new Date().toISOString().split('T')[0];
      countLabel.innerText = `${tasks.length} PENDIENTE(S)`;

      if (!Array.isArray(tasks) || tasks.length === 0) {
        list.innerHTML = `
          <div class="text-center py-8 bg-white/70 dark:bg-slate-900/50 rounded-lg border border-dashed border-slate-300 dark:border-slate-800 font-mono">
            <i data-lucide="check-circle" class="w-6 h-6 text-emerald-500 mx-auto mb-1"></i>
            <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">[SIN TAREAS PENDIENTES]</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      const prioDot = {
        'Alta': 'bg-rose-500 border-rose-400',
        'Media': 'bg-amber-500 border-amber-400',
        'Baja': 'bg-emerald-500 border-emerald-400'
      };

      tasks.forEach((task) => {
        const isOverdue = task.fechaLimite <= today;
        const item = document.createElement('div');
        item.className = `blueprint-card rounded-lg px-2.5 py-1.5 flex items-center justify-between gap-2 w-full shadow-xs`;
        
        item.innerHTML = `
          <!-- Indicador de Prioridad + Contenido en 1 sola línea -->
          <div class="flex items-center gap-2 min-w-0 flex-grow">
            <!-- Pila de estado/prioridad -->
            <span class="w-2.5 h-2.5 rounded-full ${prioDot[task.prioridad] || prioDot['Media']} flex-shrink-0 border" title="Prioridad: ${task.prioridad}"></span>
            
            <div class="min-w-0 flex-grow">
              <div class="flex items-center gap-1.5">
                <p class="font-medium text-slate-900 dark:text-slate-100 text-xs truncate leading-tight">${task.descripcion}</p>
                ${isOverdue ? '<span class="text-[8px] bg-rose-600 text-white px-1 rounded font-bold uppercase flex-shrink-0">URG</span>' : ''}
              </div>
              <p class="text-[9px] text-slate-400 font-mono truncate">📅 ${task.fechaLimite} | ${task.categoria}</p>
            </div>
          </div>

          <!-- Botón Táctil Estrecho -->
          <button onclick="completeTask('${task.id}')" title="Marcar como Completada" 
                  class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-md active:scale-90 transition flex items-center justify-center flex-shrink-0 min-w-[36px] min-h-[36px]">
            <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
          </button>
        `;
        list.appendChild(item);
      });

      lucide.createIcons();
    }

    // Inicializar app
    initTheme();
    fetchTasks();

    // Auto-Sincronización periódica cada 3 minutos en Fully Kiosk
    setInterval(fetchTasks, 180000);
  </script>
</body>
</html>
